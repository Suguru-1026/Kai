<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KNA Core Tests</title>
  <script src="kna-tensor.js" defer></script>
  <script src="kna-rng.js" defer></script>
  <script src="kna-tokenizer.js" defer></script>
  <script src="kna-optim.js" defer></script>
  <script src="kna-layers.js" defer></script>
  <script src="kna-losses.js" defer></script>
    <script src="kna-model.js" defer></script>
  <script src="kna-tests.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      background: #11191d;
      color: #e1e9e5;
    }

    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    #status {
      margin: 0 0 20px;
      color: #a9c5b6;
    }

    pre {
      overflow: auto;
      padding: 16px;
      border: 1px solid #43534b;
      background: #17221e;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .fail {
      color: #ffaaa0;
    }

    .pass {
      color: #a3e0bc;
    }
  </style>
</head>
<body>
  <main>
    <h1>KNA Core Tests</h1>
    <p id="status" role="status">テストを実行しています...</p>
    <pre id="log" aria-live="polite"></pre>
  </main>
</body>
</html>
